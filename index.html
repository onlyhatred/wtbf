<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101010">
  <title>WTBF — Coming Soon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      min-height: 100svh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #101010;
      color: #f4f2ec;
      font-family: "Manrope", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    main {
      width: min(100%, 760px);
      text-align: center;
    }
    .eyebrow {
      margin: 0 0 28px;
      color: #a4a39d;
      font-family: "DM Mono", monospace;
      font-size: 10px;
      letter-spacing: .28em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      font-size: clamp(42px, 9vw, 86px);
      line-height: .95;
      font-weight: 800;
      letter-spacing: -.085em;
      text-transform: uppercase;
    }
    h1 span { color: #c9ff59; }
    .date {
      margin: 20px 0 42px;
      color: #aaa9a2;
      font-family: "DM Mono", monospace;
      font-size: 11px;
      letter-spacing: .2em;
      text-transform: uppercase;
    }
    .timer {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: clamp(10px, 3vw, 28px);
      max-width: 650px;
      margin: 0 auto;
    }
    .unit { min-width: 0; }
    .value {
      display: block;
      font-variant-numeric: tabular-nums;
      font-size: clamp(38px, 8vw, 76px);
      line-height: 1;
      font-weight: 600;
      letter-spacing: -.07em;
    }
    .label {
      display: block;
      margin-top: 13px;
      color: #77766f;
      font-family: "DM Mono", monospace;
      font-size: 9px;
      letter-spacing: .16em;
      text-transform: uppercase;
    }
    @media (max-width: 420px) {
      .eyebrow { margin-bottom: 24px; }
      .date { margin-bottom: 34px; }
      .timer { gap: 7px; }
      .label { font-size: 8px; letter-spacing: .1em; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { scroll-behavior: auto; }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">WTBF® / Something is coming</p>
    <h1>Coming <span>soon.</span></h1>
    <p class="date">May 01, 2027</p>
    <section class="timer" aria-label="Countdown to May 1, 2027">
      <div class="unit"><span class="value" id="days">000</span><span class="label">Days</span></div>
      <div class="unit"><span class="value" id="hours">00</span><span class="label">Hours</span></div>
      <div class="unit"><span class="value" id="minutes">00</span><span class="label">Minutes</span></div>
      <div class="unit"><span class="value" id="seconds">00</span><span class="label">Seconds</span></div>
    </section>
  </main>
  <script>
    (function () {
      const target = new Date("2027-05-01T00:00:00+03:00").getTime();
      const fields = {
        days: document.getElementById("days"),
        hours: document.getElementById("hours"),
        minutes: document.getElementById("minutes"),
        seconds: document.getElementById("seconds")
      };
      function updateCountdown() {
        const remaining = Math.max(0, target - Date.now());
        const days = Math.floor(remaining / 86400000);
        const hours = Math.floor((remaining % 86400000) / 3600000);
        const minutes = Math.floor((remaining % 3600000) / 60000);
        const seconds = Math.floor((remaining % 60000) / 1000);
        fields.days.textContent = String(days).padStart(3, "0");
        fields.hours.textContent = String(hours).padStart(2, "0");
        fields.minutes.textContent = String(minutes).padStart(2, "0");
        fields.seconds.textContent = String(seconds).padStart(2, "0");
      }
      updateCountdown();
      window.setInterval(updateCountdown, 1000);
    })();
  </script>
</body>
</html>
