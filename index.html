<html lang="en">
<head>

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#171717;--paper:#f4f0e8;--pink:#ff5aa5;--lime:#d7ff45;--blue:#5b8cff;--orange:#ff713b;--purple:#a88aff;--vh:1vh}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:'Space Grotesk',sans-serif;overflow-x:hidden;cursor:auto}a{color:inherit;text-decoration:none}button{font:inherit;color:inherit;border:0;cursor:pointer}.mono{font-family:'DM Mono',monospace;text-transform:uppercase;font-size:10px;letter-spacing:.08em}.grain{position:fixed;inset:0;pointer-events:none;z-index:20;opacity:.09;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.22'/%3E%3C/svg%3E")}
.topline{height:28px;background:var(--ink);color:white;display:flex;align-items:center;justify-content:space-between;padding:0 18px}.topline span{white-space:nowrap}.nav{height:auto;min-height:62px;padding:8px 10px;display:flex;align-items:center;justify-content:center;gap:clamp(8px,2vw,24px);position:fixed;z-index:30;width:max-content;max-width:calc(100% - 24px);left:50%;bottom:22px;top:auto;transform:translateX(-50%);border:1px solid rgba(255,255,255,.68);border-radius:999px;background:linear-gradient(145deg,rgba(255,255,255,.78),rgba(255,255,255,.3));box-shadow:0 12px 38px rgba(23,23,23,.16),inset 0 1px 0 rgba(255,255,255,.85);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px)}.logo{font-size:22px;font-weight:700;letter-spacing:-.09em;padding:10px 15px;border-radius:999px;background:rgba(255,255,255,.58);transition:transform .25s,background .25s}.logo:hover{transform:translateY(-2px);background:#fff}.navlinks{display:flex;align-items:center;gap:5px;font-size:10px;text-transform:uppercase}.navlinks a{display:inline-flex;align-items:center;justify-content:center;min-height:38px;padding:0 13px;border-radius:999px;background:rgba(255,255,255,.35);transition:background .25s,transform .25s,color .25s;white-space:nowrap}.navlinks a:hover{background:rgba(255,255,255,.9);transform:translateY(-2px)}.menu{display:none;background:transparent;font-size:12px}
.hero{min-height:780px;height:100svh;max-height:1050px;position:relative;overflow:hidden;padding:140px 4vw 45px;background:linear-gradient(115deg,#ff5aa5 0%,#a88aff 28%,#5b8cff 52%,#8bd8ce 76%,#ff875c 100%);background-size:300% 300%;animation:heroFlow 14s ease-in-out infinite alternate;isolation:isolate;transition:background .8s}.hero:before{content:"";position:absolute;width:55vw;height:55vw;max-width:780px;max-height:780px;border-radius:50%;background:var(--lime);right:8%;top:16%;filter:blur(1px);z-index:-1;animation:orb 9s ease-in-out infinite alternate}.hero:after{content:"";position:absolute;inset:-35%;background:linear-gradient(110deg,transparent 38%,rgba(255,255,255,.0) 44%,rgba(255,255,255,.28) 50%,rgba(255,255,255,.0) 56%,transparent 62%);z-index:-1;transform:translateX(-55%) rotate(8deg);animation:heroShine 8s ease-in-out infinite}.hero-kicker{display:flex;justify-content:space-between;position:relative;z-index:2}.hero h1{font-size:clamp(100px,22vw,340px);line-height:.72;letter-spacing:-.115em;margin:12vh 0 0 -2vw;position:relative;z-index:3;font-weight:700;white-space:nowrap}.hero h1 span{display:block}.hero h1 .second{padding-left:13vw}.hero-foot{display:flex;justify-content:space-between;align-items:end;position:absolute;bottom:38px;left:4vw;right:4vw;z-index:4}.hero-foot p{max-width:260px;font-size:13px;line-height:1.4}.hero-foot .date{font-size:clamp(22px,4vw,52px);font-weight:600;letter-spacing:-.06em;text-align:right}.sticker{position:absolute;z-index:5;display:grid;place-items:center;mix-blend-mode:multiply;user-select:none}.sticker-star{width:120px;height:120px;right:18%;top:19%;font-size:95px;color:var(--blue);animation:spin 18s linear infinite}.sticker-smile{width:94px;height:94px;left:7%;bottom:22%;border-radius:50%;background:var(--orange);font-size:58px;animation:bob 3s ease-in-out infinite}.sticker-tag{right:5%;top:48%;background:var(--purple);padding:14px 18px;transform:rotate(9deg);font:11px 'DM Mono';animation:tag 5s ease-in-out infinite}
.marquee{overflow:hidden;background:var(--ink);color:white;padding:15px 0;font-size:clamp(25px,5vw,64px);font-weight:700;white-space:nowrap;letter-spacing:-.06em}.marquee-track{display:inline-block;animation:marquee 24s linear infinite}.marquee em{color:var(--pink);font-style:normal}
.section{padding:120px 5vw;position:relative}.section-head{display:flex;justify-content:space-between;align-items:start;margin-bottom:55px}.eyebrow{font:10px 'DM Mono';text-transform:uppercase;letter-spacing:.1em}.section h2{font-size:clamp(48px,9vw,130px);line-height:.86;letter-spacing:-.09em;margin:20px 0;max-width:950px}.intro{background:var(--lime);overflow:hidden}.intro-copy{font-size:clamp(22px,4vw,48px);line-height:1.05;letter-spacing:-.055em;max-width:900px}.intro-copy span{color:var(--blue)}.scribble{position:absolute;right:8%;bottom:10%;font-size:clamp(90px,18vw,240px);transform:rotate(-17deg);animation:spin 30s linear infinite}
.stage{background:#e8dfff;min-height:900px;overflow:hidden;padding-bottom:150px}.stage-wrap{height:650px;position:relative;display:grid;place-items:center;perspective:1000px}.stage-orbit{position:absolute;width:min(70vw,650px);aspect-ratio:1;border:1px solid rgba(20,20,20,.25);border-radius:50%;animation:spin 24s linear infinite}.stage-orbit:before,.stage-orbit:after{content:"";position:absolute;inset:12%;border:1px dashed rgba(20,20,20,.28);border-radius:50%}.stage-orbit:after{inset:25%}.model{width:min(42vw,390px);height:520px;object-fit:cover;position:relative;z-index:2;box-shadow:22px 24px 0 var(--orange);transform:rotate(-7deg) scale(.92);transition:transform .15s linear;will-change:transform;filter:saturate(1.2)}.stage-label{position:absolute;z-index:3;font-size:clamp(48px,10vw,140px);font-weight:700;letter-spacing:-.1em;mix-blend-mode:multiply}.stage-label.left{left:2%;top:18%;transform:rotate(-90deg);transform-origin:left}.stage-label.right{right:0;bottom:14%;transform:rotate(90deg);transform-origin:right}.float-word{position:absolute;font:11px 'DM Mono';background:var(--pink);padding:10px 14px;z-index:4;transform:rotate(8deg)}
.products{background:#fff6d8}.product-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.product{position:relative;min-width:0}.product-visual{height:470px;position:relative;overflow:hidden;background:var(--tone);display:grid;place-items:center}.product-visual img{width:82%;height:88%;object-fit:cover;mix-blend-mode:multiply;transition:transform .7s cubic-bezier(.2,.8,.2,1),filter .7s}.product:hover img{transform:rotate(7deg) scale(1.12);filter:saturate(1.5)}.product:nth-child(2) .product-visual img{transform:rotate(4deg)}.product:nth-child(2):hover .product-visual img{transform:rotate(-7deg) scale(1.13)}.product:nth-child(3) .product-visual img{transform:rotate(-5deg)}.product-meta{display:flex;justify-content:space-between;padding:13px 2px;font:10px 'DM Mono';text-transform:uppercase}.product-no{position:absolute;top:14px;left:14px;background:white;border-radius:50%;width:34px;height:34px;display:grid;place-items:center;font:10px 'DM Mono'}
.lookbook{background:#ff875c;color:#171717}.look-grid{display:grid;grid-template-columns:1.1fr .8fr 1fr;gap:14px;align-items:start}.look-grid img{width:100%;object-fit:cover;display:block;transition:transform .6s}.look-grid img:hover{transform:rotate(2deg) scale(.97)}.look-grid .look-a{height:500px;margin-top:60px}.look-grid .look-b{height:370px}.look-grid .look-c{height:560px;margin-top:130px}.look-caption{font:10px 'DM Mono';margin-top:12px}
.drop{background:var(--blue);color:white;text-align:center;min-height:540px;display:grid;place-items:center;overflow:hidden}.drop h2{font-size:clamp(70px,15vw,200px);margin:0;line-height:.78;letter-spacing:-.11em}.count{display:flex;gap:clamp(12px,4vw,55px);justify-content:center;margin:45px 0}.count strong{font-size:clamp(30px,6vw,70px);display:block;letter-spacing:-.07em}.count span{font:9px 'DM Mono';text-transform:uppercase}.drop-star{position:absolute;font-size:150px;color:var(--lime);animation:spin 20s linear infinite}.drop-star.one{left:5%;top:8%}.drop-star.two{right:5%;bottom:4%;font-size:100px;color:var(--pink)}
.footer{background:var(--ink);color:white;padding:70px 5vw 25px}.footer-top{display:flex;justify-content:space-between;gap:40px;align-items:start}.footer-logo{font-size:clamp(80px,19vw,250px);font-weight:700;letter-spacing:-.12em;line-height:.8}.footer-links{display:grid;gap:10px;font:11px 'DM Mono';text-transform:uppercase}.footer-bottom{border-top:1px solid #555;margin-top:80px;padding-top:18px;display:flex;justify-content:space-between;font:9px 'DM Mono';text-transform:uppercase}
.reveal{opacity:0;transform:translateY(55px) rotate(2deg);transition:opacity .8s,transform .8s cubic-bezier(.2,.8,.2,1)}.reveal.in{opacity:1;transform:translateY(0) rotate(0)}
.nav-actions{display:flex;align-items:center;gap:8px;flex-shrink:0}.language-switch{display:inline-flex;align-items:center;gap:4px;padding:4px;border:1px solid rgba(255,255,255,.72);border-radius:999px;background:linear-gradient(145deg,rgba(255,255,255,.78),rgba(255,255,255,.24));box-shadow:0 5px 18px rgba(23,23,23,.10),inset 0 1px 0 rgba(255,255,255,.9);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}.language-switch button{display:grid;place-items:center;min-width:40px;height:32px;padding:0 11px;border:1px solid transparent;border-radius:999px;background:transparent;color:rgba(23,23,23,.62);font:600 10px 'DM Mono';letter-spacing:.08em;opacity:1;transition:color .22s ease,background .22s ease,box-shadow .22s ease,transform .22s ease}.language-switch button:hover{color:var(--ink);background:rgba(255,255,255,.62);transform:translateY(-1px)}.language-switch button.active{color:#fff;background:linear-gradient(120deg,var(--pink),var(--purple) 58%,var(--blue));border-color:rgba(255,255,255,.6);box-shadow:0 3px 10px rgba(91,75,150,.25),inset 0 1px 0 rgba(255,255,255,.34)}.language-switch button:focus-visible{outline:2px solid var(--ink);outline-offset:3px}.nav .menu{padding:6px 0}@media(max-width:760px){.nav{bottom:12px;gap:5px;padding:6px;min-height:52px}.nav-actions{gap:4px}.logo{font-size:17px;padding:8px 10px}.navlinks{gap:3px;font-size:7px}.navlinks a{min-height:32px;padding:0 8px}.language-switch{gap:2px;padding:2px}.language-switch button{min-width:29px;height:27px;padding:0 6px;font-size:8px}}
@media(max-width:760px){.navlinks{display:flex;white-space:nowrap}.menu{display:none}.hero{min-height:720px;padding-top:120px}.hero h1{font-size:23vw;margin-top:18vh}.hero:before{width:95vw;height:95vw;right:-15%;top:24%}.sticker-star{right:12%;top:20%;font-size:65px}.sticker-smile{width:66px;height:66px;font-size:40px}.sticker-tag{top:57%;right:4%}.hero-foot{bottom:24px;align-items:end}.hero-foot p{max-width:160px;font-size:11px}.hero-foot .date{font-size:23px}.section{padding:80px 5vw}.section-head{margin-bottom:35px}.stage{min-height:760px}.stage-wrap{height:520px}.model{width:65vw;height:410px}.stage-label.left{left:0;top:12%}.stage-label.right{right:0;bottom:9%}.product-grid{grid-template-columns:1fr 1fr}.product-visual{height:300px}.product:last-child{grid-column:1/-1}.product:last-child .product-visual{height:390px}.look-grid{grid-template-columns:1fr 1fr}.look-grid .look-a{height:330px;margin-top:25px}.look-grid .look-b{height:250px}.look-grid .look-c{height:300px;margin-top:20px;grid-column:1/-1;width:75%;justify-self:end}.footer-top{display:block}.footer-links{display:flex;flex-wrap:wrap;margin-top:35px}.footer-bottom{margin-top:50px;gap:20px;flex-wrap:wrap}}
/* Touch input does not activate the custom cursor; keep cursor layers available for a connected mouse. */
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}}
html,body,body *{-webkit-user-select:none!important;-moz-user-select:none!important;-ms-user-select:none!important;user-select:none!important;-webkit-touch-callout:none!important}::selection{background:transparent;color:inherit}::-moz-selection{background:transparent;color:inherit}
</style></head>
<body>
<div class="grain" aria-hidden="true"></div>
<nav class="nav">
<a class="logo" href="#home">WTBF®</a>
<div class="navlinks">
<a href="#concept" data-i18n="navConcept">CONCEPT</a>
<a href="#collection" data-i18n="navCollection">COLLECTION</a>
<a href="#lookbook" data-i18n="navLookbook">LOOKBOOK</a>
<a href="#drop" data-i18n="navDrop">DROP 001</a>
</div>
<div class="nav-actions">
<div class="language-switch" role="group" aria-label="Language" data-i18n-aria="languageLabel">
<button type="button" class="active" data-lang="en" aria-pressed="true" aria-label="English" data-i18n-aria="englishLabel">EN</button>
<button type="button" data-lang="uk" aria-pressed="false" aria-label="Українська" data-i18n-aria="ukrainianLabel">UA</button>
</div>
</div>
</nav>
<header class="hero" id="home">
<h1><span>WT</span><span class="second">BF®</span></h1>
<div class="sticker sticker-star" aria-hidden="true">✳</div>
<div class="sticker sticker-smile" aria-hidden="true">✳</div>
</header>
<section class="section intro" id="concept">
<h2 class="reveal" data-i18n="conceptTitle">CONCEPT</h2>
<div class="scribble" aria-hidden="true">✳</div>
</section>
<section class="section stage" id="motion">
<h2 class="reveal" data-i18n="motionTitle">MOTION</h2>
<div class="stage-wrap">
<div class="stage-orbit" aria-hidden="true"></div>
<img class="model" id="scrollModel" src="https://images.unsplash.com/photo-1523398002811-999ca8dec234?auto=format&fit=crop&w=900&q=85" alt="Streetwear editorial model" data-i18n-alt="modelAlt">
</div>
</section>
<section class="section products" id="collection">
<div class="section-head"><h2 class="reveal" data-i18n="collectionTitle">COLLECTION</h2></div>
<div class="product-grid">
<article class="product" style="--tone:#ff9fbd"><div class="product-visual"><img src="https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?auto=format&fit=crop&w=800&q=85" alt="T-shirt" data-i18n-alt="teeAlt"></div><div class="product-meta"><span data-i18n="teeName">T-SHIRT</span></div></article>
<article class="product" style="--tone:#a9c7ff"><div class="product-visual"><img src="https://images.unsplash.com/photo-1556821840-3a63f95609a7?auto=format&fit=crop&w=800&q=85" alt="Hoodie" data-i18n-alt="hoodieAlt"></div><div class="product-meta"><span data-i18n="hoodieName">HOODIE</span></div></article>
<article class="product" style="--tone:#c9ed72"><div class="product-visual"><img src="https://images.unsplash.com/photo-1503342217505-b0a15ec3261c?auto=format&fit=crop&w=800&q=85" alt="Daily wear" data-i18n-alt="dailyAlt"></div><div class="product-meta"><span data-i18n="dailyName">DAILY WEAR</span></div></article>
</div>
</section>
<section class="section lookbook" id="lookbook">
<h2 class="reveal" data-i18n="lookbookTitle">LOOKBOOK</h2>
<div class="look-grid">
<div><img class="look-a" src="https://images.unsplash.com/photo-1539109136881-3be0616acf4b?auto=format&fit=crop&w=900&q=85" alt="Lookbook image one" data-i18n-alt="lookAltOne"></div>
<div><img class="look-b" src="https://images.unsplash.com/photo-1529139574466-a303027c1d8b?auto=format&fit=crop&w=900&q=85" alt="Lookbook image two" data-i18n-alt="lookAltTwo"></div>
<div><img class="look-c" src="https://images.unsplash.com/photo-1525507119028-ed4c629a60a3?auto=format&fit=crop&w=900&q=85" alt="Lookbook image three" data-i18n-alt="lookAltThree"></div>
</div>
</section>
<section class="section drop" id="drop">
<div class="drop-star one" aria-hidden="true">✳</div><div class="drop-star two" aria-hidden="true">✳</div>
<div>
<h2 data-i18n="dropTitle">MAY 2027</h2>
<div class="count" id="countdown">
<div><strong>—</strong><span data-i18n="days">Days</span></div>
<div><strong>—</strong><span data-i18n="hours">Hours</span></div>
<div><strong>—</strong><span data-i18n="minutes">Minutes</span></div>
<div><strong>—</strong><span data-i18n="seconds">Seconds</span></div>
</div>
</div>
</section>
<script>


const reveals=document.querySelectorAll('.reveal');const observer=new IntersectionObserver(entries=>entries.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');observer.unobserve(e.target)}}),{threshold:.12});reveals.forEach(el=>observer.observe(el));
const model=document.getElementById('scrollModel');let ticking=false;function updateScroll(){const r=model.parentElement.getBoundingClientRect();const progress=Math.min(1,Math.max(0,(innerHeight-r.top)/(innerHeight+r.height)));const rot=-12+progress*25;const scale=.82+Math.sin(progress*Math.PI)*.22;const y=(progress-.5)*100;model.style.transform='translateY('+y+'px) rotate('+rot+'deg) scale('+scale+')';model.style.borderRadius=(progress*42)+'% '+((1-progress)*8)+'% '+(progress*8)+'% '+((1-progress)*42)+'%';model.style.filter='hue-rotate('+(progress*100)+'deg) saturate('+(1.1+progress*.8)+')';ticking=false}window.addEventListener('scroll',()=>{if(!ticking){requestAnimationFrame(updateScroll);ticking=true}},{passive:true});updateScroll();

const target=new Date('2027-05-01T00:00:00');function tick(){let d=Math.max(0,target-Date.now());const vals=[Math.floor(d/86400000),Math.floor(d/3600000)%24,Math.floor(d/60000)%60,Math.floor(d/1000)%60];document.querySelectorAll('#countdown strong').forEach((el,i)=>el.textContent=String(vals[i]).padStart(2,'0'))}tick();setInterval(tick,1000);
document.querySelectorAll('.product-visual').forEach(el=>{el.addEventListener('pointermove',e=>{const r=el.getBoundingClientRect();el.style.setProperty('--mx',((e.clientX-r.left)/r.width-.5)*18+'deg');el.style.setProperty('--my',((e.clientY-r.top)/r.height-.5)*-18+'deg')});el.addEventListener('pointerleave',()=>{el.style.removeProperty('--mx');el.style.removeProperty('--my')})});

const translations={
en:{
 pageTitle:"WTBF® — Want To Be Free",
 languageLabel:"Language",englishLabel:"English",ukrainianLabel:"Ukrainian",
 navConcept:"CONCEPT",navCollection:"COLLECTION",navLookbook:"LOOKBOOK",navDrop:"DROP 001",
 conceptTitle:"CONCEPT",motionTitle:"MOTION",collectionTitle:"COLLECTION",lookbookTitle:"LOOKBOOK",
 teeName:"T-SHIRT",hoodieName:"HOODIE",dailyName:"DAILY WEAR",
 dropTitle:"MAY 2027",days:"Days",hours:"Hours",minutes:"Minutes",seconds:"Seconds",
 modelAlt:"Streetwear editorial model",teeAlt:"T-shirt",hoodieAlt:"Hoodie",dailyAlt:"Daily wear",
 lookAltOne:"Lookbook image one",lookAltTwo:"Lookbook image two",lookAltThree:"Lookbook image three"
},
uk:{
 pageTitle:"WTBF® — Носи невідоме",
 languageLabel:"Мова",englishLabel:"Англійська",ukrainianLabel:"Українська",
 navConcept:"КОНЦЕПЦІЯ",navCollection:"КОЛЕКЦІЯ",navLookbook:"ЛУКБУК",navDrop:"ДРОП 001",
 conceptTitle:"КОНЦЕПЦІЯ",motionTitle:"РУХ",collectionTitle:"КОЛЕКЦІЯ",lookbookTitle:"ЛУКБУК",
 teeName:"ФУТБОЛКА",hoodieName:"ХУДІ",dailyName:"ЩОДЕННИЙ ОДЯГ",
 dropTitle:"ТРАВЕНЬ 2027",days:"Днів",hours:"Годин",minutes:"Хвилин",seconds:"Секунд",
 modelAlt:"Модель у вуличному одязі",teeAlt:"Футболка",hoodieAlt:"Худі",dailyAlt:"Повсякденний одяг",
 lookAltOne:"Перше фото лукбуку",lookAltTwo:"Друге фото лукбуку",lookAltThree:"Третє фото лукбуку"
}
};
function setLanguage(language){
 const lang=language==="uk"?"uk":"en",dictionary=translations[lang];
 document.documentElement.lang=lang;
 document.title=dictionary.pageTitle;
 document.querySelectorAll("[data-i18n]").forEach(element=>{
  const value=dictionary[element.dataset.i18n];
  if(value!==undefined)element.textContent=value;
 });
 document.querySelectorAll("[data-i18n-alt]").forEach(element=>{
  const value=dictionary[element.dataset.i18nAlt];
  if(value!==undefined)element.alt=value;
 });
 document.querySelectorAll("[data-i18n-aria]").forEach(element=>{
  const value=dictionary[element.dataset.i18nAria];
  if(value!==undefined)element.setAttribute("aria-label",value);
 });
 document.querySelectorAll("[data-lang]").forEach(button=>{
  const active=button.dataset.lang===lang;
  button.classList.toggle("active",active);
  button.setAttribute("aria-pressed",String(active));
  const key=button.dataset.i18nAria;
  if(key&&dictionary[key])button.setAttribute("aria-label",dictionary[key]);
 });
 try{localStorage.setItem("wtbf-language",lang)}catch(error){}
}
document.querySelectorAll("[data-lang]").forEach(button=>button.addEventListener("click",()=>setLanguage(button.dataset.lang)));
let initialLanguage="en";
try{if(localStorage.getItem("wtbf-language")==="uk")initialLanguage="uk"}catch(error){}
setLanguage(initialLanguage);

</script></body></html>
