/* WTBF full-site chrome art direction */
:root{--ink:#111318;--paper:#c5c9ce;--pink:#aeb5bf;--lime:#e7ebef;--blue:#777f89;--orange:#8b929c;--purple:#dce0e5}

.hero{perspective:1100px}
.chrome-object,.chrome-layer{position:absolute;pointer-events:none;transform-style:preserve-3d}

.chrome-object:after,.chrome-layer:after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(115deg,transparent 25%,rgba(255,255,255,.9) 48%,rgba(255,255,255,.08) 54%,transparent 70%);background-size:220% 100%;animation:objectGlint 4.8s ease-in-out infinite;mix-blend-mode:screen}
.hero-orb{width:clamp(110px,18vw,245px);aspect-ratio:1;border-radius:50%;right:14%;top:20%;z-index:2;transform:rotateX(18deg) rotateY(-25deg);animation:chromeObjectLight 7s ease-in-out infinite,orbFloat 7s ease-in-out infinite}

.intro{isolation:isolate}.intro-layer{width:clamp(220px,38vw,520px);height:clamp(90px,14vw,180px);right:-5%;bottom:8%;z-index:-0;border-radius:50%;background:linear-gradient(110deg,#4c5561,#fff 18%,#8993a0 36%,#fff 52%,#515b68 72%,#e8edf2);box-shadow:0 25px 40px rgba(20,25,32,.25),inset 0 8px 16px rgba(255,255,255,.9);transform:rotate(-18deg) skewX(-18deg);animation:layerDrift 11s ease-in-out infinite}

.stage-orb{width:clamp(70px,11vw,145px);aspect-ratio:1;border-radius:50%;right:16%;top:22%;z-index:3;animation:chromeObjectLight 6s ease-in-out infinite,orbFloat 6s ease-in-out infinite}

/* WTBF — fluid editorial direction */
:root{--ink:#171717;--paper:#f4f0e8;--pink:#ff5aa5;--lime:#d7ff45;--blue:#5b8cff;--orange:#ff713b;--purple:#a88aff}
body{background:var(--paper);color:var(--ink)}
.topline{background:#171717;color:#fff;animation:none}
.hero{background:var(--paper);color:var(--ink);animation:none;isolation:isolate}
.hero:before{content:"";position:absolute;z-index:0;pointer-events:none;left:-12%;top:24%;width:125%;height:38%;background:linear-gradient(100deg,var(--pink),var(--orange) 28%,var(--lime) 55%,var(--blue) 78%,var(--purple));clip-path:polygon(0 36%,13% 10%,28% 26%,43% 0,59% 23%,74% 5%,88% 30%,100% 12%,100% 65%,86% 88%,70% 70%,54% 100%,39% 74%,23% 95%,10% 72%,0 90%);transform:rotate(-7deg);transform-origin:center;animation:heroRibbon 13s cubic-bezier(.45,0,.35,1) infinite alternate;opacity:.9}
.hero:after{inset:0;background:linear-gradient(115deg,transparent 38%,rgba(255,255,255,.7) 49%,transparent 60%);transform:translateX(-120%);mix-blend-mode:overlay;animation:editorialSweep 7s ease-in-out infinite}
.hero h1{color:#171717;text-shadow:0 2px 0 rgba(255,255,255,.55)}
.hero-kicker,.hero-foot{z-index:3}
.marquee{background:#171717;color:#fff;animation:none}
.marquee em{color:var(--pink);text-shadow:none}
.section{animation:none}
.intro{background:var(--lime);color:#171717}
.stage{background:#e8dfff;color:#171717}
.products{background:#fff6d8;color:#171717}
.lookbook{background:#ff875c;color:#171717}
.drop{background:#5b8cff;color:#fff;isolation:isolate}
.stage-orbit,.stage-orb,.intro-layer,.hero-orb,.hero-ring,.hero-slab,.drop-sphere,.drop-ring,.drop-layer{display:none!important}
.model{box-shadow:22px 24px 0 var(--orange);filter:saturate(1.12);border-radius:2px;will-change:transform,clip-path}
.product-visual{background:var(--tone);border:0;box-shadow:none;overflow:hidden}
.product-visual:before{display:none}
.product-visual img{mix-blend-mode:multiply;filter:none;border:0;box-shadow:none;transform:scale(.92);transition:transform .8s cubic-bezier(.2,.8,.2,1),filter .8s}
.product:hover .product-visual img{transform:scale(1.04) rotate(-2deg);filter:saturate(1.22)}
.product:nth-child(2) .product-visual img,.product:nth-child(3) .product-visual img{transform:scale(.92)}
.product:nth-child(2):hover .product-visual img,.product:nth-child(3):hover .product-visual img{transform:scale(1.04) rotate(2deg)}
.look-grid img{filter:none;border:0;box-shadow:none;transform:translateY(0);transition:transform .8s cubic-bezier(.2,.8,.2,1),filter .8s}
.look-grid img:hover{filter:saturate(1.12);transform:translateY(-8px) scale(.985)}
.section h2,.drop h2,.count strong{color:inherit;text-shadow:none}
.footer{background:#171717;color:#fff;animation:none}
.footer-logo{color:#fff;text-shadow:none}
.footer-bottom{border-color:#555}
.nav{background:rgba(255,255,255,.72);border:1px solid rgba(23,23,23,.12);box-shadow:0 12px 38px rgba(23,23,23,.13);backdrop-filter:blur(20px)}
.nav:before,.nav:after{display:none}
.logo{background:#171717;color:#fff;box-shadow:none}
.navlinks a,.language-switch{background:rgba(255,255,255,.9);border-color:rgba(23,23,23,.15);box-shadow:none}
.navlinks a:hover,.language-switch button.active{background:#171717;color:#fff}
.language-switch button{color:#171717}
.reveal{opacity:0;transform:translateY(42px);transition:opacity .85s ease,transform .85s cubic-bezier(.16,1,.3,1)}
.reveal.in{opacity:1;transform:translateY(0)}
.motion-item{opacity:0;transform:translateY(54px) scale(.975);transition:opacity .9s ease,transform 1s cubic-bezier(.16,1,.3,1);will-change:transform,opacity}
.motion-item.is-visible{opacity:1;transform:translateY(0) scale(1)}
.product.motion-item:nth-child(2){transition-delay:.12s}
.product.motion-item:nth-child(3){transition-delay:.24s}
.look-grid>div.motion-item:nth-child(2){transition-delay:.14s}
.look-grid>div.motion-item:nth-child(3){transition-delay:.28s}
.motion-image{opacity:0;clip-path:inset(12% 0 12% 0);transition:opacity 1s ease,clip-path 1.2s cubic-bezier(.16,1,.3,1)}
.motion-image.is-visible{opacity:1;clip-path:inset(0 0 0 0)}
.count>div{transition:transform .5s cubic-bezier(.16,1,.3,1)}
.count>div:hover{transform:translateY(-8px)}
@keyframes heroRibbon{0%{transform:translate3d(-2%,0,0) rotate(-7deg) scaleY(.9)}50%{transform:translate3d(2%,-3%,0) rotate(-3deg) scaleY(1.12)}100%{transform:translate3d(-1%,2%,0) rotate(-9deg) scaleY(.96)}}
@keyframes editorialSweep{0%,18%{transform:translateX(-120%);opacity:0}35%{opacity:.8}65%,100%{transform:translateX(120%);opacity:0}}

@media(prefers-reduced-motion:reduce){.hero:before,.hero:after{animation:none!important}.motion-item,.motion-image,.reveal{opacity:1!important;transform:none!important;clip-path:none!important;transition:none!important}}

/* WTBF — chrome editorial system: metal as material, not floating decoration */
:root{--metal:linear-gradient(112deg,#343b45 0%,#dce1e7 12%,#fff 22%,#858e99 34%,#f8fafc 46%,#5c6570 59%,#e8edf2 72%,#747d88 84%,#fff 100%)}
.intro{background:#e5e7e9;color:#15181d;padding-top:clamp(100px,13vw,180px);padding-bottom:clamp(100px,13vw,180px);isolation:isolate}
.intro:after{content:"";display:block;height:clamp(12px,2vw,24px);width:min(76%,980px);margin:65px 0 0 auto;background:var(--metal);background-size:220% 100%;box-shadow:0 8px 22px rgba(18,23,30,.18),inset 0 1px 0 #fff;transform:skewX(-24deg);animation:metalPass 8s ease-in-out infinite}
.intro h2,.stage h2,.products h2,.lookbook h2{font-size:clamp(58px,11vw,158px);letter-spacing:-.095em;line-height:.82}
.intro h2{background:var(--metal);background-size:220% 100%;background-clip:text;-webkit-background-clip:text;color:transparent;text-shadow:none}
.stage{background:#171a20;color:#f4f0e8;min-height:0;padding-bottom:clamp(90px,12vw,160px)}

.model{width:min(42vw,430px);height:clamp(390px,48vw,590px);box-shadow:18px 20px 0 #8e98a4,0 0 0 1px rgba(255,255,255,.75);filter:saturate(.82) contrast(1.06);transition:filter .7s,box-shadow .7s}
.stage-wrap:hover .model{filter:saturate(1.08) contrast(1.08);box-shadow:24px 26px 0 #cbd1d9,0 0 0 1px #fff}
.products{background:#e8e9e9;color:#171a20;padding-top:clamp(100px,12vw,160px);padding-bottom:clamp(100px,12vw,160px)}
.products .section-head{align-items:end;border-bottom:1px solid rgba(20,24,30,.22);padding-bottom:28px}
.products h2{background:var(--metal);background-size:220% 100%;background-clip:text;-webkit-background-clip:text;color:transparent}
.product-grid{gap:clamp(12px,2vw,24px)}
.product{padding:10px;background:#f5f5f3;border:1px solid rgba(255,255,255,.9);box-shadow:0 12px 32px rgba(20,25,32,.08);transition:transform .7s cubic-bezier(.16,1,.3,1),box-shadow .7s}
.product:hover{transform:translateY(-10px);box-shadow:0 24px 45px rgba(20,25,32,.16)}

.product:hover .product-visual img,.product:nth-child(2):hover .product-visual img,.product:nth-child(3):hover .product-visual img{transform:scale(1);filter:saturate(1.08)}
.product:nth-child(2) .product-visual img,.product:nth-child(3) .product-visual img{transform:scale(.97)}
.product-meta{padding:17px 3px 7px;color:#171a20;font-size:11px;letter-spacing:.08em}
