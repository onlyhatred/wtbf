<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f4f0e8"><title>WTBF™ — Want To Be Free</title><meta name="description" content="WTBF — Want To Be Free. Independent clothing shaped by art, culture and self-expression.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
 --ink:#171a1f;
 --ink-2:#222831;
 --paper:#f0f0ed;
 --panel:#fafaf8;
 --panel-muted:#dedfdf;
 --line:rgba(23,26,31,.16);
 --metal:linear-gradient(112deg,#303741 0%,#dce1e7 12%,#fff 22%,#858e99 34%,#f8fafc 46%,#5c6570 59%,#e8edf2 72%,#747d88 84%,#fff 100%);
 --mono:'DM Mono',monospace;
 --sans:'Space Grotesk',Arial,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:30px}
body{margin:0;background:#dfe1e2;color:var(--ink);font-family:var(--sans);overflow-x:hidden}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
button{font:inherit;cursor:pointer}
::selection{background:#cbd0d5;color:var(--ink)}
.grain{position:fixed;inset:0;pointer-events:none;z-index:40;opacity:.045;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.22'/%3E%3C/svg%3E")}
.mono,.eyebrow{font:10px var(--mono);letter-spacing:.12em;text-transform:uppercase}

/* Fixed navigation: separate frosted dock, consistently white controls */
.nav{
 position:fixed;z-index:50;left:50%;bottom:20px;top:auto;transform:translateX(-50%);
 display:flex;align-items:center;justify-content:center;gap:8px;
 width:max-content;max-width:calc(100% - 24px);padding:8px 10px;
 border:1px solid rgba(255,255,255,.48);border-radius:999px;
 background:rgba(175,182,191,.3);backdrop-filter:blur(18px) saturate(1.2);
 -webkit-backdrop-filter:blur(18px) saturate(1.2);
 box-shadow:0 12px 34px rgba(12,16,22,.2),inset 0 1px 0 rgba(255,255,255,.42);
}
.nav .logo,.navlinks a,.language-switch button{
 display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;
 height:38px;min-height:38px;padding:0 13px;border-radius:999px;
 border:1px solid rgba(23,26,31,.14);background:#fff;color:#171a1f;
 font-family:Arial,Helvetica,sans-serif;font-size:10px;font-style:normal;
 font-weight:700;letter-spacing:.07em;line-height:1;text-transform:uppercase;
 white-space:nowrap;text-shadow:none;box-shadow:0 3px 10px rgba(8,12,18,.12),inset 0 1px 0 #fff;
 transform:none;transition:background .2s,border-color .2s;
}
.nav .logo{letter-spacing:.07em}
.navlinks{display:flex;align-items:center;gap:5px}
.nav .logo:hover,.navlinks a:hover,.language-switch button:hover,
.language-switch button.active,.language-switch button.active:hover{
 background:#fff;color:#171a1f;transform:none;
}
.language-switch{display:flex;align-items:center;gap:4px}
.language-switch button{min-width:38px;padding:0 10px}
.nav a:focus-visible,.language-switch button:focus-visible{outline:2px solid #171a1f;outline-offset:3px}

/* Each page region is an independent panel */
.hero{
 position:relative;isolation:isolate;overflow:hidden;
 min-height:1180px;height:140svh;max-height:1500px;
 margin:12px;border:1px solid rgba(255,255,255,.58);border-radius:8px;
 padding:clamp(28px,4vw,60px) 5vw 40px;
 background:linear-gradient(116deg,#343b44 0%,#dce1e7 12%,#f8fafc 23%,#8a929d 36%,#f5f7f9 49%,#555e69 62%,#dfe3e8 75%,#737c87 88%,#f8fafb 100%);
 background-size:240% 100%;animation:metalFlow 15s ease-in-out infinite;
 display:flex;align-items:center;justify-content:center;
}
.hero:before{
 content:"";position:absolute;z-index:-1;pointer-events:none;
 left:-12%;top:43%;width:126%;height:clamp(70px,12vw,160px);
 transform:rotate(-9deg);
 background:linear-gradient(100deg,#303741 0%,#f9fbfd 11%,#9ba5b1 22%,#fff 34%,#5d6672 47%,#eef1f4 59%,#68717d 73%,#fff 86%,#454e59 100%);
 background-size:220% 100%;animation:metalFlow 8s linear infinite;
 box-shadow:0 18px 36px rgba(20,25,32,.2),inset 0 2px 0 rgba(255,255,255,.9);
}
.hero:after{
 content:"";position:absolute;inset:-30%;z-index:0;pointer-events:none;
 background:linear-gradient(110deg,transparent 38%,rgba(255,255,255,0) 46%,rgba(255,255,255,.64) 50%,rgba(255,255,255,.05) 54%,transparent 62%);
 transform:translateX(-65%) rotate(7deg);mix-blend-mode:screen;animation:heroShine 6s ease-in-out infinite;
}
.hero h1{
 position:relative;z-index:2;margin:0;
 font-family:Arial,Helvetica,sans-serif;font-size:clamp(72px,17vw,245px);
 font-weight:900;letter-spacing:-.085em;line-height:.8;white-space:nowrap;
 color:#171a1f;text-shadow:0 2px 0 rgba(255,255,255,.7),0 14px 30px rgba(20,25,32,.2);
}
.hero h1 .trademark{display:inline-block;font-size:.28em;vertical-align:top;line-height:1;margin-left:.06em;letter-spacing:0}
.hero .hero-kicker{position:absolute;top:30px;left:4vw;z-index:2;font:10px var(--mono);letter-spacing:.15em;text-transform:uppercase;color:#222831}
.hero .hero-foot{position:absolute;bottom:28px;left:4vw;right:4vw;z-index:2;display:flex;justify-content:space-between;gap:20px;font:10px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:#222831}

/* A restrained separator between panels */
.marquee{overflow:hidden;margin:0 12px;background:var(--ink);color:#f4f4f1;padding:15px 0;white-space:nowrap;border-radius:4px}
.marquee-track{display:inline-block;animation:marquee 28s linear infinite}
.marquee em{color:#dce1e7;font-style:normal}

/* CONCEPT — clean light editorial panel */
.section{
 position:relative;margin:14px 12px;border:1px solid rgba(255,255,255,.58);
 border-radius:8px;overflow:hidden;padding:clamp(84px,10vw,145px) 5vw;
}
.intro{
 min-height:480px;display:flex;flex-direction:column;justify-content:center;
 background:linear-gradient(135deg,#f7f7f4,#e1e3e4 55%,#f9faf9);
 color:var(--ink);
}
.intro h2,.stage h2,.products h2,.lookbook h2{
 position:relative;margin:0;font-size:clamp(58px,10vw,144px);
 line-height:.82;letter-spacing:-.095em;font-weight:700;text-transform:uppercase;
}
.intro h2{
 color:transparent;background:var(--metal);background-size:220% 100%;
 background-clip:text;-webkit-background-clip:text;
}
.intro:after{
 content:"";display:block;width:min(72%,920px);height:clamp(10px,1.4vw,17px);
 margin:58px 0 0 auto;background:var(--metal);background-size:220% 100%;
 box-shadow:0 8px 22px rgba(20,25,32,.18),inset 0 1px 0 #fff;
 transform:skewX(-22deg);animation:metalPass 8s ease-in-out infinite;
}

/* MOTION — separate graphite feature panel */
.stage{
 background:#191d23;color:#f0f1f0;
 padding-top:clamp(78px,9vw,125px);padding-bottom:clamp(80px,10vw,140px);
 min-height:0;
}
.stage h2{color:#f0f1f0;margin-bottom:42px}
.stage-wrap{
 position:relative;height:clamp(500px,62vw,760px);
 display:grid;place-items:center;perspective:1200px;
}
.stage-wrap:before{
 content:"";position:absolute;inset:7% 15%;
 border:1px solid rgba(238,242,246,.23);pointer-events:none;
}
.model{
 position:relative;z-index:2;width:min(42vw,450px);height:clamp(410px,49vw,610px);
 object-fit:cover;filter:grayscale(.42) contrast(1.08);
 box-shadow:20px 22px 0 #69727e,0 0 0 1px rgba(255,255,255,.8);
 transition:filter .7s,box-shadow .7s;
}
.stage-wrap:hover .model{filter:grayscale(.08) contrast(1.04);box-shadow:25px 27px 0 #bfc6ce,0 0 0 1px #fff}

/* COLLECTION — independent cards with a physical product-photo frame */
.products{
 background:#f6f6f3;color:var(--ink);
 padding-top:clamp(90px,10vw,140px);padding-bottom:clamp(90px,10vw,140px);
}
.products .section-head{
 display:flex;justify-content:space-between;align-items:end;
 padding-bottom:25px;margin-bottom:42px;border-bottom:1px solid var(--line);
}
.products h2{color:transparent;background:var(--metal);background-size:220% 100%;background-clip:text;-webkit-background-clip:text}
.product-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(12px,1.8vw,22px)}
.product{
 min-width:0;padding:10px;background:#e7e8e6;
 border:1px solid rgba(30,35,42,.12);border-radius:5px;
 box-shadow:0 10px 26px rgba(18,24,31,.08);
 transition:transform .5s cubic-bezier(.16,1,.3,1),box-shadow .5s;
}
.product:hover{transform:translateY(-6px);box-shadow:0 19px 35px rgba(18,24,31,.14)}
.product-visual{
 position:relative;height:clamp(300px,37vw,480px);overflow:hidden;
 padding:10px;background:var(--metal);background-size:200% 100%;
 box-shadow:inset 0 1px 0 #fff;
}
.product-visual img{
 width:100%;height:100%;object-fit:cover;mix-blend-mode:normal;
 filter:grayscale(.35) contrast(1.04);
 transform:scale(.98);transition:transform .8s cubic-bezier(.16,1,.3,1),filter .7s;
}
.product:hover .product-visual img{transform:scale(1.03);filter:grayscale(0) contrast(1.03)}
.product-meta{
 display:flex;align-items:center;justify-content:space-between;
 padding:17px 4px 7px;color:#20252c;
 font:10px var(--mono);letter-spacing:.12em;text-transform:uppercase;
}

/* LOOKBOOK — separate gallery panel and aligned photo frames */
.lookbook{
 background:#d5d8da;color:var(--ink);
 padding-top:clamp(90px,10vw,145px);padding-bottom:clamp(90px,10vw,145px);
}
.lookbook h2{
 color:transparent;background:var(--metal);background-size:220% 100%;
 background-clip:text;-webkit-background-clip:text;margin-bottom:54px;
}
.look-grid{display:grid;grid-template-columns:1.08fr .82fr 1fr;gap:clamp(12px,2vw,24px);align-items:start}
.look-grid>div{
 min-width:0;padding:8px;background:var(--metal);background-size:200% 100%;
 box-shadow:0 15px 32px rgba(18,24,31,.17);
}
.look-grid>div:nth-child(1){margin-top:42px}
.look-grid>div:nth-child(3){margin-top:82px}
.look-grid img{
 width:100%;object-fit:cover;display:block;filter:grayscale(.32) contrast(1.05);
 transition:transform .85s cubic-bezier(.16,1,.3,1),filter .7s;
}
.look-grid .look-a{height:clamp(350px,41vw,550px)}
.look-grid .look-b{height:clamp(290px,34vw,460px)}
.look-grid .look-c{height:clamp(390px,45vw,600px)}
.look-grid img:hover{transform:scale(.975);filter:grayscale(0) contrast(1.03)}

/* DROP — focal release panel */
.drop{
 position:relative;isolation:isolate;overflow:hidden;
 margin:14px 12px 22px;border:1px solid rgba(255,255,255,.16);border-radius:8px;
 min-height:620px;padding:clamp(88px,10vw,130px) 5vw;
 display:grid;place-items:center;text-align:center;
 background:#171a20;color:#f1f2f0;
}
.drop:before{
 content:"";position:absolute;z-index:-1;top:0;left:0;right:0;height:clamp(10px,1.4vw,18px);
 background:var(--metal);background-size:220% 100%;animation:metalPass 8s ease-in-out infinite;
}
.drop h2{
 margin:0;font-size:clamp(68px,14vw,196px);line-height:.8;
 letter-spacing:-.105em;font-weight:700;
 color:transparent;background:var(--metal);background-size:220% 100%;
 background-clip:text;-webkit-background-clip:text;
}
.count{display:flex;justify-content:center;gap:clamp(18px,4.5vw,65px);margin:42px 0 0}
.count>div{
 min-width:88px;padding:15px 12px 4px;
 border-top:1px solid rgba(255,255,255,.4);
}
.count strong{display:block;color:#f1f2f0;font-size:clamp(32px,5.5vw,68px);font-weight:600;letter-spacing:-.075em;font-variant-numeric:tabular-nums}
.count span{display:block;margin-top:7px;color:#adb5bf;font:9px var(--mono);letter-spacing:.1em;text-transform:uppercase}

/* Existing footer styles remain available if the footer is enabled later */
.footer{background:#101318;color:#f1f2f0;padding:70px 5vw 25px}
.footer-logo{color:transparent;background:var(--metal);background-clip:text;-webkit-background-clip:text}
.footer-bottom{border-color:rgba(255,255,255,.24)}

/* Purposeful scroll movement */
.reveal{opacity:0;transform:translateY(38px);transition:opacity .8s ease,transform .9s cubic-bezier(.16,1,.3,1)}
.reveal.in{opacity:1;transform:translateY(0)}
.motion-item{opacity:0;transform:translateY(42px) scale(.985);transition:opacity .85s ease,transform .95s cubic-bezier(.16,1,.3,1)}
.motion-item.is-visible{opacity:1;transform:translateY(0) scale(1)}
.product.motion-item:nth-child(2),.look-grid>div.motion-item:nth-child(2){transition-delay:.12s}
.product.motion-item:nth-child(3),.look-grid>div.motion-item:nth-child(3){transition-delay:.24s}
.motion-image{opacity:0;clip-path:inset(9% 0 9% 0);transition:opacity .9s,clip-path 1.1s cubic-bezier(.16,1,.3,1)}
.motion-image.is-visible{opacity:1;clip-path:inset(0)}
@keyframes metalFlow{0%{background-position:0% 50%}100%{background-position:220% 50%}}
@keyframes metalPass{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
@keyframes heroShine{0%,15%{transform:translateX(-70%) rotate(7deg);opacity:0}28%{opacity:1}72%,100%{transform:translateX(70%) rotate(7deg);opacity:0}}

@media(max-width:760px){
 .nav{bottom:10px;gap:4px;padding:6px 7px;max-width:calc(100% - 12px);overflow-x:auto;justify-content:flex-start;scrollbar-width:none}
 .nav::-webkit-scrollbar{display:none}
 .nav .logo,.navlinks a,.language-switch button{height:34px;min-height:34px;padding:0 8px;font-size:8px;letter-spacing:.035em}
 .navlinks{gap:3px}.language-switch{gap:3px}.language-switch button{min-width:30px;padding:0 7px}
 .hero{min-height:980px;height:125svh;max-height:none;margin:6px;padding:22px 5vw}
 .hero h1{font-size:clamp(68px,18vw,135px)}
 .hero .hero-kicker{top:22px;left:5vw;font-size:8px}
 .hero .hero-foot{left:5vw;right:5vw;bottom:20px;font-size:8px;gap:12px}
 .section{margin:9px 6px;border-radius:6px;padding:78px 5vw}
 .intro{min-height:370px}
 .intro:after{width:86%;margin-top:42px}
 .intro h2,.stage h2,.products h2,.lookbook h2{font-size:clamp(54px,13vw,92px)}
 .stage{padding-top:75px;padding-bottom:80px}
 .stage h2{margin-bottom:28px}
 .stage-wrap{height:500px}
 .stage-wrap:before{inset:10% 4%}
 .model{width:68vw;height:410px}
 .products .section-head{margin-bottom:30px;padding-bottom:20px}
 .product-grid{grid-template-columns:1fr 1fr;gap:12px}
 .product{padding:6px}
 .product:last-child{grid-column:1/-1}
 .product-visual{height:clamp(230px,62vw,340px);padding:6px}
 .product:last-child .product-visual{height:clamp(300px,82vw,420px)}
 .product-meta{font-size:8px;padding:12px 3px 5px;letter-spacing:.07em}
 .lookbook h2{margin-bottom:35px}
 .look-grid{grid-template-columns:1fr 1fr;gap:10px}
 .look-grid>div{padding:5px}
 .look-grid>div:nth-child(1){margin-top:22px}
 .look-grid>div:nth-child(2){margin-top:0}
 .look-grid>div:nth-child(3){grid-column:1/-1;width:82%;justify-self:end;margin-top:18px}
 .look-grid .look-a{height:clamp(260px,70vw,360px)}
 .look-grid .look-b{height:clamp(220px,58vw,320px)}
 .look-grid .look-c{height:clamp(290px,82vw,400px)}
 .drop{margin:9px 6px 14px;min-height:500px;padding:78px 5vw}
 .drop h2{font-size:clamp(62px,16vw,110px)}
 .count{gap:8px;margin-top:30px}
 .count>div{min-width:0;flex:1;padding:13px 5px 3px}
 .count strong{font-size:clamp(25px,7.5vw,42px)}
 .count span{font-size:7px;letter-spacing:.04em}
}
@media(max-width:360px){
 .nav{gap:3px;padding:5px}
 .nav .logo,.navlinks a,.language-switch button{padding:0 6px;font-size:7px}
 .navlinks{gap:2px}
}
@media(prefers-reduced-motion:reduce){
 html{scroll-behavior:auto}
 .hero,.hero:before,.hero:after,.intro:after,.drop:before{animation:none!important}
 .reveal,.motion-item,.motion-image{opacity:1!important;transform:none!important;clip-path:none!important;transition:none!important}
}
</style></head>
<body>
<div class="grain" aria-hidden="true"></div>
<nav class="nav">
<a class="logo" href="#home">WTBF™</a>
<div class="navlinks">
<a href="#concept" data-i18n="navConcept">CONCEPT</a>
<a href="#collection" data-i18n="navCollection">COLLECTION</a>
<a href="#lookbook" data-i18n="navLookbook">LOOKBOOK</a>
<a href="#drop" data-i18n="navDrop">DROP</a>
</div>
<div class="nav-actions">
<div class="language-switch" role="group" aria-label="Language" data-i18n-aria="languageLabel">
<button type="button" class="active" data-lang="en" aria-pressed="true" aria-label="English" data-i18n-aria="englishLabel">EN</button>
<button type="button" data-lang="uk" aria-pressed="false" aria-label="Українська" data-i18n-aria="ukrainianLabel">UA</button>
</div>
</div>
</nav>
<header class="hero" id="home">

<h1>WTBF<span class="trademark">™</span></h1>
</header>
<section class="section intro" id="concept">
<h2 class="reveal" data-i18n="conceptTitle">CONCEPT</h2>

</section>
<section class="section stage" id="motion">
<h2 class="reveal" data-i18n="motionTitle">MOTION</h2>
<div class="stage-wrap">

<img class="model" id="scrollModel" src="https://images.unsplash.com/photo-1523398002811-999ca8dec234?auto=format&fit=crop&w=900&q=85" alt="Streetwear editorial model" data-i18n-alt="modelAlt">
</div>
</section>
<section class="section products" id="collection">
<div class="section-head"><h2 class="reveal" data-i18n="collectionTitle">COLLECTION</h2></div>
<div class="product-grid">
<article class="product" style="--tone:#ff9fbd"><div class="product-visual"><img src="https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?auto=format&fit=crop&w=800&q=85" alt="T-shirt" data-i18n-alt="teeAlt"></div><div class="product-meta"><span data-i18n="teeName">T-SHIRT</span></div></article>
<article class="product" style="--tone:#a9c7ff"><div class="product-visual"><img src="https://images.unsplash.com/photo-1556821840-3a63f95609a7?auto=format&fit=crop&w=800&q=85" alt="Hoodie" data-i18n-alt="hoodieAlt"></div><div class="product-meta"><span data-i18n="hoodieName">HOODIE</span></div></article>
<article class="product" style="--tone:#c9ed72"><div class="product-visual"><img src="https://images.unsplash.com/photo-1503342217505-b0a15ec3261c?auto=format&fit=crop&w=800&q=85" alt="Daily wear" data-i18n-alt="dailyAlt"></div><div class="product-meta"><span data-i18n="dailyName">DAILY WEAR</span></div></article>
</div>
</section>
<section class="section lookbook" id="lookbook">
<h2 class="reveal" data-i18n="lookbookTitle">LOOKBOOK</h2>
<div class="look-grid">
<div><img class="look-a" src="https://images.unsplash.com/photo-1539109136881-3be0616acf4b?auto=format&fit=crop&w=900&q=85" alt="Lookbook image one" data-i18n-alt="lookAltOne"></div>
<div><img class="look-b" src="https://images.unsplash.com/photo-1529139574466-a303027c1d8b?auto=format&fit=crop&w=900&q=85" alt="Lookbook image two" data-i18n-alt="lookAltTwo"></div>
<div><img class="look-c" src="https://images.unsplash.com/photo-1525507119028-ed4c629a60a3?auto=format&fit=crop&w=900&q=85" alt="Lookbook image three" data-i18n-alt="lookAltThree"></div>
</div>
</section>
<section class="section drop" id="drop">

<div>
<h2 data-i18n="dropTitle">MAY 2027</h2>
<div class="count" id="countdown">
<div><strong>—</strong><span data-i18n="days">Days</span></div>
<div><strong>—</strong><span data-i18n="hours">Hours</span></div>
<div><strong>—</strong><span data-i18n="minutes">Minutes</span></div>
<div><strong>—</strong><span data-i18n="seconds">Seconds</span></div>
</div>
</div>
</section>
<script>


const revealObserver=new IntersectionObserver(entries=>entries.forEach(entry=>{if(entry.isIntersecting){entry.target.classList.add('in','is-visible');revealObserver.unobserve(entry.target)}}),{threshold:.14,rootMargin:'0px 0px -5% 0px'});document.querySelectorAll('.reveal').forEach(el=>revealObserver.observe(el));document.querySelectorAll('.product,.look-grid>div,.count>div').forEach(el=>{el.classList.add('motion-item');revealObserver.observe(el)});document.querySelectorAll('.look-grid img').forEach(el=>{el.classList.add('motion-image');revealObserver.observe(el)});
const model=document.getElementById('scrollModel');model.classList.add('motion-image');let ticking=false;function updateScroll(){const r=model.parentElement.getBoundingClientRect();const progress=Math.min(1,Math.max(0,(innerHeight-r.top)/(innerHeight+r.height)));const rot=-7+progress*14;const scale=.94+Math.sin(progress*Math.PI)*.08;const y=(progress-.5)*52;model.style.transform='translateY('+y+'px) rotate('+rot+'deg) scale('+scale+')';ticking=false}window.addEventListener('scroll',()=>{if(!ticking){requestAnimationFrame(updateScroll);ticking=true}},{passive:true});updateScroll();

const target=new Date('2027-05-01T00:00:00');function tick(){let d=Math.max(0,target-Date.now());const vals=[Math.floor(d/86400000),Math.floor(d/3600000)%24,Math.floor(d/60000)%60,Math.floor(d/1000)%60];document.querySelectorAll('#countdown strong').forEach((el,i)=>el.textContent=String(vals[i]).padStart(2,'0'))}tick();setInterval(tick,1000);

};
function setLanguage(language){
 const lang=language==="uk"?"uk":"en",dictionary=translations[lang];
 document.documentElement.lang=lang;
 document.title=dictionary.pageTitle;
 document.querySelectorAll("[data-i18n]").forEach(element=>{
  const value=dictionary[element.dataset.i18n];
  if(value!==undefined)element.textContent=value;
 });
 document.querySelectorAll("[data-i18n-alt]").forEach(element=>{
  const value=dictionary[element.dataset.i18nAlt];
  if(value!==undefined)element.alt=value;
 });
 document.querySelectorAll("[data-i18n-aria]").forEach(element=>{
  const value=dictionary[element.dataset.i18nAria];
  if(value!==undefined)element.setAttribute("aria-label",value);
 });
 document.querySelectorAll("[data-lang]").forEach(button=>{
  const active=button.dataset.lang===lang;
  button.classList.toggle("active",active);
  button.setAttribute("aria-pressed",String(active));
  const key=button.dataset.i18nAria;
  if(key&&dictionary[key])button.setAttribute("aria-label",dictionary[key]);
 });
 try{localStorage.setItem("wtbf-language",lang)}catch(error){}
}
document.querySelectorAll("[data-lang]").forEach(button=>button.addEventListener("click",()=>setLanguage(button.dataset.lang)));
let initialLanguage="en";
try{if(localStorage.getItem("wtbf-language")==="uk")initialLanguage="uk"}catch(error){}
setLanguage(initialLanguage);
