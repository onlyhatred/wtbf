<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title>Countdown</title>
  <style>
    :root { color-scheme: dark; }

    * {
      box-sizing: border-box;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background: #000;
    }

    body {
      min-height: 100svh;
      display: grid;
      place-items: center;
      overflow: hidden;
      padding: 24px;
      font-family: Arial, Helvetica, sans-serif;
      -webkit-font-smoothing: antialiased;
      cursor: default;
    }

    .timer {
      position: relative;
      isolation: isolate;
      width: min(1000px, 100%);
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      align-items: center;
      gap: clamp(10px, 3vw, 36px);
      text-align: center;
    }

    .timer::before {
      content: "";
      position: absolute;
      z-index: -1;
      inset: -48% -10%;
      pointer-events: none;
      background: radial-gradient(
        ellipse at center,
        rgba(180,180,180,.11) 0%,
        rgba(100,100,100,.045) 38%,
        transparent 72%
      );
      filter: blur(26px);
    }

    .unit {
      position: relative;
      min-width: 0;
      padding: 10px 0;
    }

    .unit + .unit::before {
      content: "";
      position: absolute;
      top: 20%;
      bottom: 20%;
      left: calc(clamp(10px, 3vw, 36px) / -2);
      width: 1px;
      background: linear-gradient(
        180deg,
        transparent,
        rgba(220,220,220,.3),
        transparent
      );
    }

    .chrome {
      color: #e7e7e7;
      background: linear-gradient(
        110deg,
        #555 0%,
        #d7d7d7 10%,
        #fff 17%,
        #777 26%,
        #f5f5f5 36%,
        #626262 46%,
        #fefefe 56%,
        #858585 66%,
        #fff 76%,
        #666 87%,
        #dedede 100%
      );
      background-size: 260% 100%;
      background-position: 0% 50%;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
      animation: chromeFlow 5.5s linear infinite;
      filter: drop-shadow(0 2px 9px rgba(225,225,225,.17));
    }

    @keyframes chromeFlow {
      0% { background-position: 0% 50%; }
      100% { background-position: 100% 50%; }
    }

    .value {
      display: block;
      font-size: clamp(42px, 9.5vw, 108px);
      line-height: 1;
      font-weight: 700;
      letter-spacing: -.055em;
      font-variant-numeric: tabular-nums;
      font-feature-settings: "tnum";
    }

    .label {
      display: block;
      margin-top: 18px;
      font-size: clamp(10px, 1.2vw, 12px);
      line-height: 1.2;
      font-weight: 700;
      letter-spacing: .17em;
      text-indent: .17em;
      text-transform: uppercase;
      opacity: 1;
    }

    @media (max-width: 520px) {
      body { padding: 15px; }
      .timer { gap: 6px; }
      .unit + .unit::before { left: -3px; }
      .value { font-size: clamp(34px, 10vw, 52px); }
      .label {
        margin-top: 13px;
        font-size: clamp(8px, 2.1vw, 10px);
        letter-spacing: .1em;
        text-indent: .1em;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .chrome { animation: none; }
    }
  </style>
</head>
<body>
  <main class="timer" aria-label="Countdown to May 1, 2027">
    <div class="unit">
      <span class="value chrome" id="days">000</span>
      <span class="label chrome">Days</span>
    </div>
    <div class="unit">
      <span class="value chrome" id="hours">00</span>
      <span class="label chrome">Hours</span>
    </div>
    <div class="unit">
      <span class="value chrome" id="minutes">00</span>
      <span class="label chrome">Minutes</span>
    </div>
    <div class="unit">
      <span class="value chrome" id="seconds">00</span>
      <span class="label chrome">Seconds</span>
    </div>
  </main>

  <script>
    (() => {
      const target = new Date("2027-05-01T00:00:00+03:00").getTime();
      const fields = {
        days: document.getElementById("days"),
        hours: document.getElementById("hours"),
        minutes: document.getElementById("minutes"),
        seconds: document.getElementById("seconds")
      };

      function updateCountdown() {
        const remaining = Math.max(0, target - Date.now());
        fields.days.textContent = String(Math.floor(remaining / 86400000)).padStart(3, "0");
        fields.hours.textContent = String(Math.floor((remaining % 86400000) / 3600000)).padStart(2, "0");
        fields.minutes.textContent = String(Math.floor((remaining % 3600000) / 60000)).padStart(2, "0");
        fields.seconds.textContent = String(Math.floor((remaining % 60000) / 1000)).padStart(2, "0");
      }

      updateCountdown();
      window.setInterval(updateCountdown, 1000);
    })();
  </script>
</body>
</html>
