<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title>Countdown</title>
  <style>
    :root {
      color-scheme: dark;
      --chrome-top: #ffffff;
      --chrome-mid: #a7a7a7;
      --chrome-dark: #515151;
    }

    * {
      box-sizing: border-box;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background: #000;
    }

    body {
      min-height: 100svh;
      display: grid;
      place-items: center;
      overflow: hidden;
      padding: 24px;
      font-family: Arial, Helvetica, sans-serif;
      -webkit-font-smoothing: antialiased;
      cursor: default;
    }

    .timer {
      position: relative;
      isolation: isolate;
      width: min(960px, 100%);
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      align-items: center;
      gap: clamp(8px, 3vw, 34px);
      text-align: center;
    }

    .timer::before {
      content: "";
      position: absolute;
      z-index: -1;
      inset: -42% -8%;
      pointer-events: none;
      background: radial-gradient(ellipse at center, rgba(160,160,160,.095) 0%, rgba(75,75,75,.035) 36%, transparent 70%);
      filter: blur(22px);
    }

    .unit {
      position: relative;
      min-width: 0;
      padding: 8px 0;
    }

    .unit + .unit::before {
      content: "";
      position: absolute;
      top: 22%;
      bottom: 22%;
      left: calc(clamp(8px, 3vw, 34px) / -2);
      width: 1px;
      background: linear-gradient(180deg, transparent, rgba(210,210,210,.22), transparent);
    }

    .chrome {
      color: #d8d8d8;
      background: linear-gradient(
        180deg,
        #454545 0%,
        #bcbcbc 9%,
        #ffffff 17%,
        #8a8a8a 28%,
        #f7f7f7 39%,
        #666666 50%,
        #eeeeee 62%,
        #777777 73%,
        #fdfdfd 84%,
        #777777 94%,
        #d0d0d0 100%
      );
      background-size: 100% 180%;
      background-position: 50% 48%;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 2px 8px rgba(220,220,220,.12));
    }

    .value {
      display: block;
      font-size: clamp(42px, 9.5vw, 108px);
      line-height: .98;
      font-weight: 700;
      letter-spacing: -.085em;
      font-variant-numeric: tabular-nums;
      font-feature-settings: "tnum";
    }

    .label {
      display: block;
      margin-top: 19px;
      font-size: clamp(8px, 1.15vw, 10px);
      line-height: 1;
      font-weight: 600;
      letter-spacing: .28em;
      text-indent: .28em;
      text-transform: uppercase;
      opacity: .82;
    }

    @media (max-width: 520px) {
      body { padding: 16px; }
      .timer { gap: 5px; }
      .unit + .unit::before { left: -3px; }
      .value { font-size: clamp(34px, 10vw, 52px); }
      .label {
        margin-top: 14px;
        font-size: 7px;
        letter-spacing: .15em;
        text-indent: .15em;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto; }
    }
  </style>
</head>
<body>
  <main class="timer" aria-label="Countdown to May 1, 2027">
    <div class="unit">
      <span class="value chrome" id="days">000</span>
      <span class="label chrome">Days</span>
    </div>
    <div class="unit">
      <span class="value chrome" id="hours">00</span>
      <span class="label chrome">Hours</span>
    </div>
    <div class="unit">
      <span class="value chrome" id="minutes">00</span>
      <span class="label chrome">Minutes</span>
    </div>
    <div class="unit">
      <span class="value chrome" id="seconds">00</span>
      <span class="label chrome">Seconds</span>
    </div>
  </main>

  <script>
    (() => {
      const target = new Date("2027-05-01T00:00:00+03:00").getTime();
      const fields = {
        days: document.getElementById("days"),
        hours: document.getElementById("hours"),
        minutes: document.getElementById("minutes"),
        seconds: document.getElementById("seconds")
      };

      function updateCountdown() {
        const remaining = Math.max(0, target - Date.now());
        fields.days.textContent = String(Math.floor(remaining / 86400000)).padStart(3, "0");
        fields.hours.textContent = String(Math.floor((remaining % 86400000) / 3600000)).padStart(2, "0");
        fields.minutes.textContent = String(Math.floor((remaining % 3600000) / 60000)).padStart(2, "0");
        fields.seconds.textContent = String(Math.floor((remaining % 60000) / 1000)).padStart(2, "0");
      }

      updateCountdown();
      window.setInterval(updateCountdown, 1000);
    })();
  </script>
</body>
</html>
