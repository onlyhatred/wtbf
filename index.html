<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title>Countdown</title>
  <style>
    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background: #000;
    }

    body {
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Arial, Helvetica, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .timer {
      width: min(900px, 100%);
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      align-items: center;
      gap: clamp(8px, 3vw, 30px);
      text-align: center;
    }

    .unit { min-width: 0; }

    .chrome {
      color: #d8d8d8;
      background: linear-gradient(
        180deg,
        #555 0%,
        #f8f8f8 13%,
        #858585 27%,
        #fff 39%,
        #777 52%,
        #eeeeee 66%,
        #686868 80%,
        #e5e5e5 100%
      );
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 1px 1px rgba(255,255,255,.08);
    }

    .value {
      display: block;
      font-size: clamp(42px, 9vw, 100px);
      line-height: 1;
      font-weight: 700;
      letter-spacing: -.075em;
      font-variant-numeric: tabular-nums;
    }

    .label {
      display: block;
      margin-top: 16px;
      font-size: clamp(8px, 1.2vw, 11px);
      font-weight: 600;
      letter-spacing: .22em;
      text-transform: uppercase;
    }

    @media (max-width: 480px) {
      .timer { gap: 5px; }
      .value { font-size: clamp(34px, 10vw, 48px); }
      .label { margin-top: 12px; font-size: 7px; letter-spacing: .13em; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { scroll-behavior: auto; }
    }
  </style>
</head>
<body>
  <main class="timer" aria-label="Countdown to May 1, 2027">
    <div class="unit">
      <span class="value chrome" id="days">000</span>
      <span class="label chrome">Days</span>
    </div>
    <div class="unit">
      <span class="value chrome" id="hours">00</span>
      <span class="label chrome">Hours</span>
    </div>
    <div class="unit">
      <span class="value chrome" id="minutes">00</span>
      <span class="label chrome">Minutes</span>
    </div>
    <div class="unit">
      <span class="value chrome" id="seconds">00</span>
      <span class="label chrome">Seconds</span>
    </div>
  </main>

  <script>
    (() => {
      const target = new Date("2027-05-01T00:00:00+03:00").getTime();
      const fields = {
        days: document.getElementById("days"),
        hours: document.getElementById("hours"),
        minutes: document.getElementById("minutes"),
        seconds: document.getElementById("seconds")
      };

      function updateCountdown() {
        const remaining = Math.max(0, target - Date.now());
        fields.days.textContent = String(Math.floor(remaining / 86400000)).padStart(3, "0");
        fields.hours.textContent = String(Math.floor((remaining % 86400000) / 3600000)).padStart(2, "0");
        fields.minutes.textContent = String(Math.floor((remaining % 3600000) / 60000)).padStart(2, "0");
        fields.seconds.textContent = String(Math.floor((remaining % 60000) / 1000)).padStart(2, "0");
      }

      updateCountdown();
      window.setInterval(updateCountdown, 1000);
    })();
  </script>
</body>
</html>
